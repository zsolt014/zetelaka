<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETELAKI CAMPING</title>
<style>
  :root{
    --moss-dark:#1c3b1f;
    --moss:#2e5c31;
    --fern:#4f8a3d;
    --leaf:#7cb342;
    --sun:#f4d35e;
    --cream:#fdf6e3;
    --bark:#5a3d2b;
    --amber:#c47f2c;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    width:100%;
    overflow-x:hidden;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(124,179,66,0.25), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(244,211,94,0.15), transparent 50%),
      linear-gradient(160deg, var(--moss-dark) 0%, var(--moss) 45%, var(--fern) 100%);
    position:relative;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }

  /* scattered decorations */
  .deco{
    position:fixed;
    pointer-events:none;
    opacity:0.9;
    z-index:0;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,0.35));
  }
  .deco.spin-slow{ animation:sway 6s ease-in-out infinite; }
  .deco.bob{ animation:bob 4s ease-in-out infinite; }

  @keyframes sway{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0px); }
    50%{ transform:translateY(-10px); }
  }

  .card{
    position:relative;
    z-index:2;
    background:rgba(20,40,20,0.55);
    border:3px solid rgba(244,211,94,0.55);
    border-radius:28px;
    padding:56px 44px 48px;
    max-width:640px;
    width:100%;
    text-align:center;
    backdrop-filter:blur(6px);
    box-shadow:0 20px 60px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.05);
  }

  h1{
    font-family:'Georgia', 'Times New Roman', serif;
    font-weight:900;
    letter-spacing:3px;
    font-size:clamp(2.1rem, 6vw, 3.6rem);
    color:var(--sun);
    text-shadow:0 3px 0 var(--bark), 0 8px 18px rgba(0,0,0,0.5);
    margin:0 0 8px;
    line-height:1.05;
  }

  .subtitle-tag{
    display:inline-block;
    color:var(--leaf);
    background:rgba(0,0,0,0.25);
    padding:4px 14px;
    border-radius:999px;
    font-size:0.8rem;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:18px;
    border:1px solid rgba(124,179,66,0.6);
  }

  .question{
    color:var(--cream);
    font-size:clamp(1.3rem, 3.2vw, 1.7rem);
    font-weight:700;
    margin:18px 0 34px;
    line-height:1.4;
    text-shadow:0 2px 6px rgba(0,0,0,0.4);
  }

  .buttons{
    position:relative;
    display:flex;
    gap:24px;
    justify-content:center;
    align-items:center;
    min-height:90px;
  }

  button{
    font-family:inherit;
    font-weight:800;
    font-size:1.4rem;
    letter-spacing:1px;
    border:none;
    border-radius:16px;
    padding:20px 46px;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }

  #yesBtn{
    background:linear-gradient(180deg, var(--leaf), var(--moss));
    color:var(--cream);
    box-shadow:0 8px 0 #274d22, 0 14px 22px rgba(0,0,0,0.4);
  }
  #yesBtn:hover{
    transform:translateY(-3px);
    box-shadow:0 11px 0 #274d22, 0 18px 26px rgba(0,0,0,0.45);
  }
  #yesBtn:active{
    transform:translateY(4px);
    box-shadow:0 4px 0 #274d22, 0 8px 14px rgba(0,0,0,0.4);
  }

  #noBtn{
    background:linear-gradient(180deg, #b5482e, #7c2b1a);
    color:var(--cream);
    box-shadow:0 8px 0 #4c1a0f, 0 14px 22px rgba(0,0,0,0.4);
    position:fixed;
    z-index:50;
    transition:top 0.25s ease, left 0.25s ease, transform 0.15s ease;
  }

  #noBtn.placed{
    position:fixed;
  }

  .footnote{
    margin-top:28px;
    color:rgba(253,246,227,0.65);
    font-size:0.8rem;
    letter-spacing:0.5px;
  }

  /* Modal */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(10,20,10,0.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .overlay.show{
    display:flex;
    animation:fadeIn 0.35s ease;
  }
  @keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  .modal{
    background:linear-gradient(160deg, var(--fern), var(--moss-dark));
    border:3px solid var(--sun);
    border-radius:24px;
    padding:44px 36px;
    max-width:520px;
    width:100%;
    text-align:center;
    color:var(--cream);
    box-shadow:0 25px 70px rgba(0,0,0,0.6);
    transform:scale(0.85);
    animation:pop 0.4s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes pop{
    to{ transform:scale(1); }
  }

  .modal h2{
    font-family:'Georgia', serif;
    color:var(--sun);
    font-size:1.6rem;
    margin-top:0;
  }
  .modal p{
    font-size:1.1rem;
    line-height:1.6;
    margin:10px 0;
  }
  .modal .dates{
    display:inline-block;
    margin-top:14px;
    background:rgba(0,0,0,0.3);
    padding:10px 20px;
    border-radius:12px;
    font-weight:800;
    font-size:1.15rem;
    color:var(--sun);
    letter-spacing:1px;
  }
  .close-btn{
    margin-top:24px;
    background:var(--sun);
    color:var(--moss-dark);
    border:none;
    border-radius:12px;
    padding:12px 30px;
    font-weight:800;
    font-size:1rem;
    cursor:pointer;
  }
  .close-btn:hover{ filter:brightness(1.08); }

  @media (prefers-reduced-motion: reduce){
    .deco.spin-slow, .deco.bob{ animation:none; }
  }
</style>
</head>
<body>

<!-- decorative tents and bottles scattered around -->
<svg class="deco bob" style="top:6%; left:4%; width:70px;" viewBox="0 0 100 80"><polygon points="50,10 90,70 10,70" fill="#e8b84b" stroke="#8a5a1c" stroke-width="3"/><polygon points="50,10 65,70 35,70" fill="#c9962f"/><rect x="46" y="65" width="8" height="12" fill="#5a3d2b"/></svg>

<svg class="deco spin-slow" style="top:12%; right:6%; width:40px;" viewBox="0 0 40 90"><ellipse cx="20" cy="20" rx="14" ry="18" fill="#7cb342" stroke="#2e5c31" stroke-width="2"/><rect x="15" y="35" width="10" height="45" rx="3" fill="#5a3d2b"/></svg>

<svg class="deco bob" style="bottom:8%; left:7%; width:36px;" viewBox="0 0 40 90"><ellipse cx="20" cy="20" rx="14" ry="18" fill="#c47f2c" stroke="#5a3d2b" stroke-width="2"/><rect x="15" y="35" width="10" height="45" rx="3" fill="#3b2a1d"/></svg>

<svg class="deco spin-slow" style="bottom:10%; right:5%; width:80px;" viewBox="0 0 100 80"><polygon points="50,10 90,70 10,70" fill="#f4d35e" stroke="#8a5a1c" stroke-width="3"/><polygon points="50,10 65,70 35,70" fill="#e0a52e"/><rect x="46" y="65" width="8" height="12" fill="#5a3d2b"/></svg>

<svg class="deco bob" style="top:45%; left:2%; width:34px;" viewBox="0 0 40 90"><ellipse cx="20" cy="20" rx="14" ry="18" fill="#7cb342" stroke="#2e5c31" stroke-width="2"/><rect x="15" y="35" width="10" height="45" rx="3" fill="#5a3d2b"/></svg>

<svg class="deco spin-slow" style="top:40%; right:3%; width:60px;" viewBox="0 0 100 80"><polygon points="50,10 90,70 10,70" fill="#e8b84b" stroke="#8a5a1c" stroke-width="3"/><polygon points="50,10 65,70 35,70" fill="#c9962f"/><rect x="46" y="65" width="8" height="12" fill="#5a3d2b"/></svg>

<svg class="deco bob" style="top:75%; left:20%; width:28px;" viewBox="0 0 40 90"><ellipse cx="20" cy="20" rx="14" ry="18" fill="#c47f2c" stroke="#5a3d2b" stroke-width="2"/><rect x="15" y="35" width="10" height="45" rx="3" fill="#3b2a1d"/></svg>

<svg class="deco spin-slow" style="top:5%; left:35%; width:30px;" viewBox="0 0 40 90"><ellipse cx="20" cy="20" rx="14" ry="18" fill="#7cb342" stroke="#2e5c31" stroke-width="2"/><rect x="15" y="35" width="10" height="45" rx="3" fill="#5a3d2b"/></svg>

<div class="card">
  <span class="subtitle-tag">🏕️ Nyári kaland • Sátor • Sör • Tábortűz</span>
  <h1>ZETELAKI CAMPING</h1>
  <p class="question">Úgy-e velünk tartasz erre a kirándulásra?</p>

  <div class="buttons">
    <button id="yesBtn" onclick="showModal()">IGEN</button>
    <button id="noBtn">NEM</button>
  </div>

  <p class="footnote">(tipp: az egyik gomb kicsit... szégyenlős 👀)</p>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Köszönjük, hogy velünk tartasz! 🏕️🍺</h2>
    <p>További információt Pejitől kaphatsz.</p>
    <p>De egy dolgot már most tudunk:</p>
    <div class="dates">Várunk augusztus 28–29–30-án!</div>
    <br>
    <button class="close-btn" onclick="closeModal()">Alig várom! 🔥</button>
  </div>
</div>

<canvas id="confettiCanvas" style="position:fixed; inset:0; pointer-events:none; z-index:200; display:none;"></canvas>

<script>
  const noBtn = document.getElementById('noBtn');
  const overlay = document.getElementById('overlay');
  let placed = false;

  /* ---------- hangeffekt (Web Audio API, nincs szükség fájlra) ---------- */
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playDodgeSound(){
    try{
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      const now = ctx.currentTime;
      // vicces "boing/szökés" hang: gyors felcsúszó frekvencia
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(660, now + 0.12);
      osc.frequency.exponentialRampToValueAtTime(340, now + 0.22);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.26);
    }catch(e){ /* audio nem elérhető, nem gond */ }
  }

  /* ---------- NEM gomb menekülése, MINDIG a látható ablakon belül ---------- */
  function placeInitial(){
    const rect = noBtn.getBoundingClientRect();
    noBtn.classList.add('placed');
    noBtn.style.top = rect.top + 'px';
    noBtn.style.left = rect.left + 'px';
    placed = true;
  }

  function clamp(value, min, max){
    return Math.max(min, Math.min(value, max));
  }

  function dodge(){
    if(!placed) placeInitial();

    const margin = 16;
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;

    // biztos, hogy a gomb TELJES egészében a viewporton belül marad
    const minX = margin;
    const minY = margin;
    const maxX = Math.max(minX, window.innerWidth - btnW - margin);
    const maxY = Math.max(minY, window.innerHeight - btnH - margin);

    let newX = Math.random() * (maxX - minX) + minX;
    let newY = Math.random() * (maxY - minY) + minY;

    newX = clamp(newX, minX, maxX);
    newY = clamp(newY, minY, maxY);

    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';

    playDodgeSound();
  }

  // ha az ablak mérete változik, a gomb ne ragadjon a láthatatlan részen
  window.addEventListener('resize', function(){
    if(!placed) return;
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;
    const margin = 16;
    const maxX = Math.max(margin, window.innerWidth - btnW - margin);
    const maxY = Math.max(margin, window.innerHeight - btnH - margin);
    const currentX = parseFloat(noBtn.style.left) || margin;
    const currentY = parseFloat(noBtn.style.top) || margin;
    noBtn.style.left = clamp(currentX, margin, maxX) + 'px';
    noBtn.style.top = clamp(currentY, margin, maxY) + 'px';
  });

  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    dodge();
  }, {passive:false});
  noBtn.addEventListener('focus', dodge);
  noBtn.addEventListener('click', function(e){
    e.preventDefault();
    dodge();
  });

  /* ---------- konfetti az IGEN gombra kattintva ---------- */
  const confettiCanvas = document.getElementById('confettiCanvas');
  const cctx = confettiCanvas.getContext('2d');
  let confettiPieces = [];
  let confettiAnimId = null;

  const confettiColors = ['#f4d35e', '#7cb342', '#e0a52e', '#fdf6e3', '#c47f2c', '#4f8a3d'];

  function resizeCanvas(){
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }

  function launchConfetti(){
    resizeCanvas();
    confettiCanvas.style.display = 'block';
    confettiPieces = [];
    const count = 140;
    for(let i = 0; i < count; i++){
      confettiPieces.push({
        x: Math.random() * confettiCanvas.width,
        y: -20 - Math.random() * confettiCanvas.height * 0.5,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 10,
        color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
        speedY: 2 + Math.random() * 3.5,
        speedX: (Math.random() - 0.5) * 2.5,
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 12,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      });
    }
    if(confettiAnimId) cancelAnimationFrame(confettiAnimId);
    animateConfetti();
  }

  function animateConfetti(){
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let stillFalling = false;

    confettiPieces.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;
      p.rotation += p.rotationSpeed;

      if(p.y < confettiCanvas.height + 30) stillFalling = true;

      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate((p.rotation * Math.PI) / 180);
      cctx.fillStyle = p.color;
      if(p.shape === 'rect'){
        cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      } else {
        cctx.beginPath();
        cctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
        cctx.fill();
      }
      cctx.restore();
    });

    if(stillFalling){
      confettiAnimId = requestAnimationFrame(animateConfetti);
    } else {
      confettiCanvas.style.display = 'none';
      cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }

  function showModal(){
    overlay.classList.add('show');
    launchConfetti();
  }
  function closeModal(){
    overlay.classList.remove('show');
  }
</script>

</body>
</html>
